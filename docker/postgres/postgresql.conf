# docker/postgres/postgresql.conf  (M1 - Dustin Dowell)
#
# Loaded with `postgres -c config_file=/etc/postgresql/postgresql.conf`
# (see docker-compose.yml). Anything not set here uses the server default.
# cron.database_name is passed on the command line from .env (PGDATABASE).

# --- connections ---------------------------------------------------------
listen_addresses = '*'            # container network; the host port is bound to 127.0.0.1 only
port = 5432
max_connections = 100
password_encryption = scram-sha-256

# --- memory / platform ----------------------------------------------------
shared_buffers = 256MB
dynamic_shared_memory_type = posix
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'

# --- extensions that must be loaded at server start ------------------------
shared_preload_libraries = 'pg_stat_statements,pg_cron'

# pg_stat_statements: per-query execution statistics (statement_history)
pg_stat_statements.track = all
pg_stat_statements.max = 5000
track_activity_query_size = 2048

# pg_cron: run jobs as background workers inside the server, so no password or
# pg_hba entry is needed for the job role (monitor_collector)
cron.use_background_workers = on
max_worker_processes = 16

# --- statistics used by the monitor schema ---------------------------------
track_io_timing = on              # block read/write timing in pg_stat_statements / pg_stat_database
track_counts = on                 # default, required by pg_stat_user_tables and autovacuum

# --- lock diagnostics ------------------------------------------------------
log_lock_waits = on
deadlock_timeout = 1s
